spec_version: 1
spec_name: RUSH01_A4
device:
  family: Elektron
  model: Analog Four MKII
  firmware:
    installed: UNVERIFIED_FROM_DEVICE
    do_not_infer: true
  value_domain: device_display_semantic
  notes:
    - Signed values are written as signed display values, not presumed raw bytes.
    - Time, waveform, filter, envelope-shape, AM, and sync values must pass through verified typed converters.
    - This first proof is deliberately dry; track FX sends remain at zero.

reference:
  filename: A4_Test1_Init_Kit.syx
  approved_as_trusted_anchor: true
  compatibility_basis: exact_target_unit_reference_dump
  expected_length_bytes: 2770
  sha256: COMPUTE_AND_RECORD_FROM_LOCAL_FILE
  preserve_unknown_bytes: true

build_policy:
  mode: patch_reference
  target: active_kit_test_first
  kit_name: RUSH01
  no_patterns: true
  no_song_data: true
  unsupported_noncritical_field_policy: preserve_reference_and_report
  unsupported_critical_field_policy: fail_a4_build
  critical_sections:
    - tracks.oscillator_1
    - tracks.oscillator_2
    - tracks.oscillator_common
    - tracks.noise
    - tracks.filter_1
    - tracks.filter_2
    - tracks.amp
    - tracks.filter_envelope
  preserve_reference_sections:
    - performance_macros
    - master_fx
    - cv
    - polyphony
    - voice_routing
    - sound_locks
    - lfo_1
    - lfo_2
    - envelope_2
    - all_unidentified_or_reserved_bytes

track_levels:
  T1: 100
  T2: 92
  T3: 82
  T4: 78
  FX: preserve_reference
  CV: preserve_reference

