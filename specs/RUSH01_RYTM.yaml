spec_version: 1
spec_name: RUSH01_RYTM
device:
  family: Elektron
  model: Analog Rytm MKII
  firmware:
    installed: UNVERIFIED_FROM_DEVICE
    do_not_infer: true
  value_domain: midi_cc_7bit_semantic
  notes:
    - Values are semantic 0-127 parameter values unless an enum is explicitly supplied.
    - For bipolar parameters, 64 is the center/zero value unless the repository's verified converter says otherwise.

reference:
  filename: RYTM_Test1_Init_Kit.syx
  approved_as_trusted_anchor: true
  compatibility_basis: exact_target_unit_reference_dump
  expected_length_bytes: 2998
  sha256: COMPUTE_AND_RECORD_FROM_LOCAL_FILE
  preserve_unknown_bytes: true

build_policy:
  mode: patch_reference
  target: active_kit_test_first
  kit_name: RUSH01
  no_patterns: true
  no_song_data: true
  sample_dependencies: none
  unsupported_noncritical_field_policy: preserve_reference_and_report
  unsupported_critical_field_policy: fail_rytm_build
  critical_sections:
    - tracks.machine
    - tracks.synth
    - tracks.filter
    - tracks.amp
  preserve_reference_sections:
    - scenes
    - performance_macros
    - master_delay
    - master_reverb
    - master_distortion
    - master_compressor
    - routing
    - retrig
    - choke_groups
    - lfo
    - all_unidentified_or_reserved_bytes

