acceptance:
  - Decode and re-encode the approved reference byte-for-byte before mutation.
  - Every changed critical parameter must resolve through a verified semantic mapping.
  - No unidentified byte may change except verified integrity fields.
  - The output must be a single valid kit SysEx frame ending in F7.
  - Decode the generated file and compare every requested critical parameter.
  - Include a manifest of original semantic value, requested value, raw encoded value, and byte location.
