[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rytm-randomizer"
version = "1.34.0"
description = "A MIDI randomizer/mutator for the Elektron Analog Rytm MK2."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = [
    "mido>=1.3,<2",
    "python-rtmidi>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "pytest-timeout>=2,<3",
    "pytest-sugar>=1,<2",
]

[project.scripts]
rytm-randomizer = "rytm_randomizer.app:main"

[tool.hatch.build.targets.wheel]
packages = ["rytm_randomizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Observability: no test may hang the suite silently. pytest-timeout aborts any
# test exceeding the limit and prints a full traceback showing exactly where it
# stuck (thread method works on Windows). A hung test becomes a visible failure.
timeout = 180
timeout_method = "thread"
# Progress visibility: pytest-sugar activates automatically and shows a live
# progress bar with running pass/fail counts and a % indicator -- so it is
# always clear how far along a run is (the suite is ~15-25 min; silence is not
# a hang). For non-interactive logs where the bar renders poorly, run with
# `-p no:sugar -v` to get a clean line-per-test `[ NN%]` instead.

# WS-I fills these
[tool.coverage.run]
branch = true
source = ["rytm_randomizer"]

# WS-I fills these
[tool.coverage.report]
