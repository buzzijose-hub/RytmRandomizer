[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rytm-randomizer"
version = "1.34.0"
description = "A MIDI randomizer/mutator for the Elektron Analog Rytm MK2."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = [
    "mido>=1.3,<2",
    "python-rtmidi>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[project.scripts]
rytm-randomizer = "rytm_randomizer.app:main"

[tool.hatch.build.targets.wheel]
packages = ["rytm_randomizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# WS-I fills these
[tool.coverage.run]
branch = true
source = ["rytm_randomizer"]

# WS-I fills these
[tool.coverage.report]
