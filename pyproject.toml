[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rytm-randomizer"
version = "1.34.0"
description = "Safe, staged tooling for the Elektron Analog Rytm MKII randomizer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Jose Buzzi" },
]
dependencies = [
  "mido>=1.3,<2",
  "python-rtmidi>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
rytm-randomizer = "rytm_randomizer.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rytm_randomizer"]

[tool.coverage.report]
fail_under = 84
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["rytm_randomizer"]
