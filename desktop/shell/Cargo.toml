[package]
name = "rytm-randomizer-shell"
version = "0.1.0"
description = "Tauri shell for the RytmRandomizer cockpit"
authors = ["RytmRandomizer contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "rytm_randomizer_shell_lib"
path = "src/lib.rs"

[[bin]]
name = "rytm-randomizer-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
