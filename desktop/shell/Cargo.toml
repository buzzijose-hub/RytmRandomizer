[package]
name = "rytm-randomizer-shell"
version = "1.34.0"
description = "Tauri shell for the RytmRandomizer cockpit"
authors = ["RytmRandomizer contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "rytm_randomizer_shell_lib"
path = "src/lib.rs"

[[bin]]
name = "rytm-randomizer-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# Update subsystem (WS-U3):
#   tauri-plugin-updater  — the signed download/stage/swap transport.
#                           Runs in check-and-notify-only mode until the
#                           Ed25519 public key exists (operator action item
#                           1); `updater::signing_key_present()` is false
#                           without it and the policy cannot emit an install
#                           effect. See tauri.conf.json `plugins.updater`.
#   sha2                  — deterministic staged-rollout bucketing
#                           (`update_policy::rollout_bucket`). No network,
#                           no keys.
tauri-plugin-updater = "2"
sha2 = "0.10"
# Already compiled into the binary via tauri-plugin-updater; declared so the
# beacon's one-byte GET does not depend on a TRANSITIVE dependency that a
# plugin bump could remove. Minimal features: the check-in needs a GET and
# nothing else, and must not drag in cookie/JSON machinery it will never use.
# No features requested: cargo unions features across the graph, so the beacon
# inherits whatever TLS backend tauri-plugin-updater already selected rather
# than forcing a second one into the binary.
reqwest = { version = "0.13", default-features = false }
# CI pin: tauri-utils 2.9.2 conflicts with time 0.3.48 on Windows/Rust 1.88.
time = "=0.3.47"
# CI pin: 2026-06-14 brotli-decompressor/alloc-stdlib releases can resolve
# alloc-no-stdlib 3.x while brotli 8.0.3 still compiles against 2.x traits.
brotli-decompressor = "=5.0.1"
alloc-stdlib = "=0.2.2"
alloc-no-stdlib = "=2.0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
