<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-label="RytmRandomizer — your musical taste, on hardware">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1116"/>
      <stop offset="100%" stop-color="#1c1820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a3d"/>
      <stop offset="100%" stop-color="#ff9d3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a3d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1280" height="480" fill="url(#bg)"/>
  <!-- ambient orange glow behind the wordmark -->
  <ellipse cx="320" cy="240" rx="320" ry="200" fill="url(#glow)"/>
  <!-- waveform stripe across the bottom -->
  <g transform="translate(0,360)" opacity="0.7">
    <path d="M 0 60 Q 40 20 80 60 T 160 60 T 240 60 T 320 60 T 400 60 T 480 60 T 560 60 T 640 60 T 720 60 T 800 60 T 880 60 T 960 60 T 1040 60 T 1120 60 T 1200 60 T 1280 60"
          fill="none" stroke="url(#accent)" stroke-width="2"/>
    <path d="M 0 60 Q 40 10 80 60 T 160 60 T 240 60 T 320 60 T 400 60 T 480 60 T 560 60 T 640 60 T 720 60 T 800 60 T 880 60 T 960 60 T 1040 60 T 1120 60 T 1200 60 T 1280 60"
          fill="none" stroke="#ff6a3d" stroke-width="1" stroke-opacity="0.4"/>
  </g>
  <!-- Left: wordmark -->
  <g transform="translate(80,140)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#f5f5f5" letter-spacing="-3">
      RytmRandomizer
    </text>
    <text x="0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#ff6a3d" letter-spacing="4">
      YOUR MUSICAL TASTE, ON HARDWARE
    </text>
    <text x="0" y="110" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#bcbcbc" letter-spacing="0.5">
      A creative cockpit for the Elektron Analog Rytm MK2.
    </text>
    <text x="0" y="135" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#bcbcbc" letter-spacing="0.5">
      Author a profile, mutate live, ship to hardware as a signed file.
    </text>
    <!-- pill badges -->
    <g transform="translate(0,170)">
      <rect x="0"   y="0" width="120" height="28" rx="14" fill="#1f2530" stroke="#2a3140"/>
      <text x="60"  y="19" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7cc4ff" text-anchor="middle">PHASE 1 · COCKPIT</text>
      <rect x="132" y="0" width="148" height="28" rx="14" fill="#1f2530" stroke="#2a3140"/>
      <text x="206" y="19" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#9be8a0" text-anchor="middle">PHASE 2 · WIZARD</text>
      <rect x="292" y="0" width="158" height="28" rx="14" fill="#1f2530" stroke="#2a3140"/>
      <text x="371" y="19" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffcf7c" text-anchor="middle">PHASE 3 · EXPORT</text>
      <rect x="462" y="0" width="170" height="28" rx="14" fill="#10141b" stroke="#222a36"/>
      <text x="547" y="19" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5b6573" text-anchor="middle">PHASE 4 · HARDWARE</text>
    </g>
  </g>
  <!-- Right: stylized Rytm pad grid 4x3 -->
  <g transform="translate(840,80)" stroke="#2a3140" stroke-width="2">
    <rect x="0"   y="0"   width="80" height="80" rx="10" fill="#1f2530"/>
    <rect x="100" y="0"   width="80" height="80" rx="10" fill="#1f2530"/>
    <rect x="200" y="0"   width="80" height="80" rx="10" fill="#1f2530"/>
    <rect x="300" y="0"   width="80" height="80" rx="10" fill="#ff6a3d" stroke="#ffaa6d" stroke-width="3"/>
    <rect x="0"   y="100" width="80" height="80" rx="10" fill="#1f2530"/>
    <rect x="100" y="100" width="80" height="80" rx="10" fill="#ff6a3d" stroke="#ffaa6d" stroke-width="3"/>
    <rect x="200" y="100" width="80" height="80" rx="10" fill="#1f2530"/>
    <rect x="300" y="100" width="80" height="80" rx="10" fill="#1f2530"/>
    <rect x="0"   y="200" width="80" height="80" rx="10" fill="#1f2530"/>
    <rect x="100" y="200" width="80" height="80" rx="10" fill="#1f2530"/>
    <rect x="200" y="200" width="80" height="80" rx="10" fill="#ff6a3d" stroke="#ffaa6d" stroke-width="3"/>
    <rect x="300" y="200" width="80" height="80" rx="10" fill="#1f2530"/>
    <!-- pad labels -->
    <g font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#bcbcbc" text-anchor="middle" stroke="none">
      <text x="40"  y="46">BD</text>
      <text x="140" y="46">SD</text>
      <text x="240" y="46">CH</text>
      <text x="340" y="46" fill="#0e1116">FX</text>
      <text x="40"  y="146">RS</text>
      <text x="140" y="146" fill="#0e1116">CY</text>
      <text x="240" y="146">CB</text>
      <text x="340" y="146">CP</text>
      <text x="40"  y="246">BT</text>
      <text x="140" y="246">LT</text>
      <text x="240" y="246" fill="#0e1116">MT</text>
      <text x="340" y="246">HT</text>
    </g>
    <!-- tagline under grid -->
    <text x="190" y="320" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500"
          fill="#8c93a0" text-anchor="middle" stroke="none" letter-spacing="2">
      12 PADS · PASSIVE BY DEFAULT · BYTE-IDENTICAL ENGINE
    </text>
  </g>
</svg>
