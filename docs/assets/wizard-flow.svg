<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Profile Wizard flow — Name, Add, Analyze, Review, Save">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13171f"/>
      <stop offset="100%" stop-color="#0c0f15"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg2)"/>
  <text x="640" y="40" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f5f5" text-anchor="middle" letter-spacing="3">
    PROFILE WIZARD
  </text>
  <text x="640" y="62" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8c93a0" text-anchor="middle">
    Author a user profile from your musical inspiration, in five steps.
  </text>
  <!-- 5 step cards -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- step template: 220 wide, 200 tall, spaced 16px -->
    <!-- step 1 -->
    <g transform="translate(50,110)">
      <rect width="220" height="200" rx="12" fill="#1c2230" stroke="#2a3140"/>
      <circle cx="32" cy="32" r="18" fill="#ff6a3d"/>
      <text x="32" y="38" font-size="16" font-weight="800" fill="#0c0f15" text-anchor="middle">1</text>
      <text x="60" y="38" font-size="15" font-weight="700" fill="#f5f5f5">Name</text>
      <text x="20" y="78" font-size="11" font-weight="500" fill="#8c93a0">Title your profile.</text>
      <rect x="20"  y="104" width="180" height="26" rx="4" fill="#0e1116" stroke="#2a3140"/>
      <text x="32"  y="121" font-size="13" font-weight="500" fill="#f5f5f5">buzzi</text>
      <text x="20"  y="158" font-size="10" font-weight="500" fill="#5b6573">optional description</text>
      <rect x="20"  y="166" width="180" height="24" rx="4" fill="#0e1116" stroke="#2a3140"/>
    </g>
    <!-- arrow -->
    <path d="M 280 210 L 300 210" stroke="#ff6a3d" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
    <!-- step 2 -->
    <g transform="translate(310,110)">
      <rect width="220" height="200" rx="12" fill="#1c2230" stroke="#2a3140"/>
      <circle cx="32" cy="32" r="18" fill="#ff6a3d"/>
      <text x="32" y="38" font-size="16" font-weight="800" fill="#0c0f15" text-anchor="middle">2</text>
      <text x="60" y="38" font-size="15" font-weight="700" fill="#f5f5f5">Add sources</text>
      <text x="20" y="78" font-size="11" font-weight="500" fill="#8c93a0">Kits · audio · references.</text>
      <g font-size="11" font-weight="600">
        <rect x="20"  y="96"  width="60" height="22" rx="11" fill="#0e1116" stroke="#2a3140"/>
        <text x="50"  y="111" fill="#bcbcbc" text-anchor="middle">+ kit</text>
        <rect x="86"  y="96"  width="80" height="22" rx="11" fill="#0e1116" stroke="#2a3140"/>
        <text x="126" y="111" fill="#bcbcbc" text-anchor="middle">+ sound</text>
        <rect x="172" y="96"  width="34" height="22" rx="11" fill="#ff6a3d"/>
        <text x="189" y="111" fill="#0c0f15" text-anchor="middle">+ ★</text>
      </g>
      <g font-size="11" font-weight="500" fill="#bcbcbc">
        <text x="20" y="146">artist · Surgeon</text>
        <text x="20" y="166">folder · /samples/techno</text>
        <text x="20" y="186">kit · industrial_v3.syx</text>
      </g>
    </g>
    <path d="M 540 210 L 560 210" stroke="#ff6a3d" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
    <!-- step 3 -->
    <g transform="translate(570,110)">
      <rect width="220" height="200" rx="12" fill="#1c2230" stroke="#2a3140"/>
      <circle cx="32" cy="32" r="18" fill="#ff6a3d"/>
      <text x="32" y="38" font-size="16" font-weight="800" fill="#0c0f15" text-anchor="middle">3</text>
      <text x="60" y="38" font-size="15" font-weight="700" fill="#f5f5f5">Analyze</text>
      <text x="20" y="78" font-size="11" font-weight="500" fill="#8c93a0">Extract style traits.</text>
      <!-- progress bars -->
      <g font-size="10" font-weight="500" fill="#8c93a0">
        <text x="20" y="106">Surgeon</text>
        <rect x="20"  y="112" width="180" height="6" rx="3" fill="#0e1116"/>
        <rect x="20"  y="112" width="180" height="6" rx="3" fill="#9be8a0"/>
        <text x="20" y="138">/samples/techno</text>
        <rect x="20"  y="144" width="180" height="6" rx="3" fill="#0e1116"/>
        <rect x="20"  y="144" width="180" height="6" rx="3" fill="#9be8a0"/>
        <text x="20" y="170">industrial_v3.syx</text>
        <rect x="20"  y="176" width="180" height="6" rx="3" fill="#0e1116"/>
        <rect x="20"  y="176" width="118" height="6" rx="3" fill="#ff9d3d"/>
      </g>
    </g>
    <path d="M 800 210 L 820 210" stroke="#ff6a3d" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
    <!-- step 4 -->
    <g transform="translate(830,110)">
      <rect width="220" height="200" rx="12" fill="#1c2230" stroke="#2a3140"/>
      <circle cx="32" cy="32" r="18" fill="#ff6a3d"/>
      <text x="32" y="38" font-size="16" font-weight="800" fill="#0c0f15" text-anchor="middle">4</text>
      <text x="60" y="38" font-size="15" font-weight="700" fill="#f5f5f5">Review</text>
      <text x="20" y="78" font-size="11" font-weight="500" fill="#8c93a0">Traits → pad mapping.</text>
      <g font-size="10" font-weight="600">
        <text x="20" y="106" fill="#bcbcbc">rolling_low_end → P1</text>
        <rect x="20"  y="112" width="180" height="5" rx="2.5" fill="#0e1116"/>
        <rect x="20"  y="112" width="153" height="5" rx="2.5" fill="#ff6a3d"/>
        <text x="20" y="136" fill="#bcbcbc">metallic_tension → P2</text>
        <rect x="20"  y="142" width="180" height="5" rx="2.5" fill="#0e1116"/>
        <rect x="20"  y="142" width="140" height="5" rx="2.5" fill="#ff6a3d"/>
        <text x="20" y="166" fill="#bcbcbc">hat_density → P3</text>
        <rect x="20"  y="172" width="180" height="5" rx="2.5" fill="#0e1116"/>
        <rect x="20"  y="172" width="99" height="5" rx="2.5" fill="#ff6a3d"/>
      </g>
    </g>
    <path d="M 1060 210 L 1080 210" stroke="#ff6a3d" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
    <!-- step 5 -->
    <g transform="translate(1090,110)">
      <rect width="140" height="200" rx="12" fill="#9be8a0" stroke="#7dc285"/>
      <circle cx="32" cy="32" r="18" fill="#0c0f15"/>
      <text x="32" y="38" font-size="16" font-weight="800" fill="#9be8a0" text-anchor="middle">5</text>
      <text x="60" y="38" font-size="15" font-weight="700" fill="#0c0f15">Save</text>
      <text x="20" y="80" font-size="11" font-weight="600" fill="#0c0f15">★ buzzi</text>
      <text x="20" y="98" font-size="10" font-weight="500" fill="#0c0f15">kind=user</text>
      <text x="20" y="114" font-size="10" font-weight="500" fill="#0c0f15">v1.0.0</text>
      <text x="20" y="148" font-size="10" font-weight="700" fill="#0c0f15">→ ProfileRegistry</text>
      <text x="20" y="166" font-size="9" font-weight="500" fill="#0c0f15">~/.rytm-randomizer/</text>
      <text x="20" y="180" font-size="9" font-weight="500" fill="#0c0f15">profiles/</text>
    </g>
  </g>
  <defs>
    <marker id="arrowhead2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#ff6a3d"/>
    </marker>
  </defs>
</svg>
