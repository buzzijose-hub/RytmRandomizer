name: release

# Triggered by pushing a version tag (e.g. v1.34.0). The tag is expected to
# match the [project] version in pyproject.toml, which is the single source of
# version truth. See the "Releasing" section of CONTRIBUTING.md.
#
# NOTE: artifact checksums (e.g. SHA256SUMS) and code-signing for any future
# bundled native installers are a documented follow-up and are intentionally
# out of scope here. This workflow performs the pip-based release only:
# it builds the wheel + sdist from pyproject.toml and publishes a GitHub Release.
#
# Recommended manual pre-release step: run the hardware-side validation
# checklist documented in docs/MANUAL_HARDWARE_VALIDATION.md. The WS-R E2E
# suite already gates merges against the canonical operator-command flow
# in --dry-run mode, but a human-driven sweep on a real Analog Rytm MK2 is
# the final confirmation that the MIDI stream actually behaves on hardware.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install ALSA dev headers (Linux)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install build backend
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run test gate
        run: pytest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
