name: installers

# Native end-user installer builds for RytmRandomizer.
#
# Produces a .msi (Windows), .pkg (macOS, console-app spec), AppImage + .deb
# (Linux) using BeeWare briefcase for the Python sidecar, AND a Tauri
# desktop bundle for the React cockpit shell on each of the same three
# OSes via `cargo tauri build`. The full release-engineer story is
# documented in docs/BUILDING_INSTALLERS.md.
#
# WHY NOT REQUIRED-CHECK: installer builds take ~20 minutes per OS and
# don't add useful signal on day-to-day PRs. The existing test / e2e /
# architecture jobs continue to gate PR merges (see .github/workflows/
# test.yml). This workflow fires on:
#
#   - workflow_call  (release.yml's shared build step — the release train)
#   - workflow_dispatch (manual no-tag rehearsal from the Actions tab)
#
# WHY NO `push: tags: v*` TRIGGER. It was removed when release.yml became
# the release train. release.yml owns the `v*` tag and calls this file via
# `uses: ./.github/workflows/installers.yml`; leaving the tag trigger in
# place would fire a SECOND, independent installer build for every release
# — double the CI minutes and two divergent artifact sets for the same
# tag, with no way for the release job to tell which one it should
# publish. `tests/architecture/test_ci_workflow.py` pins the absence.
#
# Artifacts are uploaded to the workflow run (not the GitHub Release)
# so the caller (or a release engineer on a dispatch rehearsal) can
# download, sign, and attach them. Doing OS code-signing in CI requires
# storing private keys in GitHub Secrets, which is a posture decision
# gated on the certificate purchase (spec §0.2 / U6).

on:
  workflow_call:
    inputs:
      sign:
        description: >-
          Whether the caller has the OS code-signing material available.
          Reserved for U6: today every path builds adhoc-signed artifacts,
          and a `true` value only records the intent in the step summary.
          Wiring real signing here is the U6 change, not a flag flip.
        type: boolean
        required: false
        default: false
      updater_artifacts:
        description: >-
          Whether to request Tauri updater artifacts (.tar.gz + .sig)
          alongside the normal bundles. The bundler flag itself lands in
          PR-B; until then this input is tolerated and reported, so the
          release train is callable before the updater exists.
        type: boolean
        required: false
        default: false
      ref:
        description: >-
          Git ref to build. Empty string means the ref that triggered the
          calling workflow (checkout's default), which is what a tag-driven
          release wants.
        type: string
        required: false
        default: ""
    outputs:
      installer_artifacts:
        description: Comma-separated names of the uploaded briefcase installer artifacts.
        value: ${{ jobs.installer.outputs.artifact_names }}
      sidecar_artifacts:
        description: Comma-separated names of the uploaded standalone sidecar artifacts.
        value: ${{ jobs['desktop-bundle'].outputs.sidecar_artifact_names }}
      bundle_artifacts:
        description: Comma-separated names of the uploaded Tauri cockpit-bundle artifacts.
        value: ${{ jobs['desktop-bundle'].outputs.bundle_artifact_names }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 30 min cap: installer builds are slow but should never hang.
    timeout-minutes: 30
    # Artifact names are a fixed function of the matrix, so the output is a
    # constant rather than a matrix-derived value: a matrix job's outputs
    # are last-writer-wins across shards, which would report one OS's name
    # as if it were the whole set. The `if-no-files-found: error` upload
    # guard below is what actually proves each name exists.
    outputs:
      artifact_names: >-
        rytm-randomizer-installer-Windows,rytm-randomizer-installer-macOS,rytm-randomizer-installer-Linux
    strategy:
      fail-fast: false
      matrix:
        # Briefcase MUST build each OS's artifact on that OS:
        #   - Windows MSI: needs WiX (Windows-only tool)
        #   - macOS PKG:   needs codesign + pkgbuild (macOS-only)
        #   - Linux:       Docker-based manylinux build (cross-distro)
        include:
          - os: windows-latest
            artifact_glob: "dist/*.msi"
          - os: macos-latest
            artifact_glob: "dist/*.pkg"
          - os: ubuntu-latest
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Empty on workflow_dispatch (and on a caller that omits the
          # input), which is checkout's own default — the triggering ref.
          ref: ${{ inputs.ref }}

      - name: Record build context
        shell: bash
        # `inputs.ref` is a free-text string a caller supplies. Bound
        # through `env:` rather than interpolated into the script body,
        # because `${{ }}` substitutes into the script TEXT before bash
        # parses it — a crafted ref would run as code, not print as data.
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
          BUILD_SIGN: ${{ inputs.sign || false }}
          BUILD_UPDATER_ARTIFACTS: ${{ inputs.updater_artifacts || false }}
          RUNNER_OS_LABEL: ${{ runner.os }}
        run: |
          {
            echo "### installer (${RUNNER_OS_LABEL})"
            echo ""
            echo "- ref: \`${BUILD_REF}\`"
            echo "- sign requested: \`${BUILD_SIGN}\` (adhoc-sign until U6 certificates land)"
            echo "- updater artifacts requested: \`${BUILD_UPDATER_ARTIFACTS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.11
        if: runner.os != 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      # ----- Per-OS prerequisites for briefcase. -----

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        # WiX v3 ships as a .NET tool; briefcase shells out to it to
        # generate the .msi. dotnet is preinstalled on windows-latest.
        run: dotnet tool install --global wix
        shell: pwsh

      - name: Install Xcode command line tools (macOS)
        if: runner.os == 'macOS'
        # macos-latest images preinstall Xcode CLT; this is a defensive
        # ensure step that's effectively a no-op on fresh runners.
        run: xcode-select -p || sudo xcode-select --install || true

      - name: Install ALSA + AppImage tooling (Linux)
        if: runner.os == 'Linux'
        # libasound2t64: concrete Ubuntu 24.04 provider for libasound2,
        #   the runtime ALSA shared library required by Briefcase's Linux
        #   system package dependency check.
        # libasound2-dev: python-rtmidi C-extension link target.
        # libfuse2: required to *run* an AppImage (and briefcase smoke-
        #   tests the artifact post-build).
        # python3-venv: Linux system-package builds must run Briefcase
        #   under the host system python3, not setup-python's toolcache.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libasound2-dev libfuse2 python3-venv

      # ----- Briefcase install + build. -----

      - name: Install package with installer extras
        if: runner.os != 'Linux'
        run: pip install -e ".[installer]"

      - name: Install package with installer extras (Linux system Python)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv .venv-briefcase
          . .venv-briefcase/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[installer]"
          echo "$PWD/.venv-briefcase/bin" >> "$GITHUB_PATH"

      - name: briefcase create
        run: briefcase create

      - name: briefcase build
        run: briefcase build

      - name: briefcase package (no signing in CI)
        # --no-sign / --adhoc-sign deliberately skips code-signing. CI
        # produces unsigned artifacts; the release engineer signs locally
        # with the EV cert / Developer ID. See docs/BUILDING_INSTALLERS.md
        # for the signing workflow.
        run: briefcase package --adhoc-sign
        # On Linux the Briefcase docs note adhoc-sign is a no-op (Linux
        # artifacts are not code-signed in the same sense). The flag is
        # accepted everywhere, so we keep it uniform across the matrix.

      - name: List built artifacts
        # Diagnostic step -- shows what landed in dist/ before upload.
        # Helps debug a missing-glob without re-running the whole matrix.
        shell: bash
        run: ls -la dist/ || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: rytm-randomizer-installer-${{ runner.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 30

  desktop-bundle:
    # Tauri-shell cockpit bundle, one artifact per OS. Briefcase (the
    # `installer` job above) only packages the Python sidecar; without
    # this job the desktop cockpit (Rust shell wrapping the Vite-built
    # React frontend) would never reach end-users via a release. The
    # bundle is uploaded to the workflow run for the release engineer
    # to attach to the GitHub Release alongside the briefcase installer.
    #
    # The shell must be built on each target OS — Tauri uses the host's
    # webview (WebView2 on Windows, WKWebView on macOS, WebKitGTK on
    # Linux) and the per-OS bundle format (MSI/EXE, DMG/APP, deb/AppImage)
    # is produced by `cargo tauri build` against that host's toolchain.
    name: desktop-bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 30 min cap: the first build per cache key compiles the entire
    # Tauri + wry + webview2-com tree; cached runs are ~5 minutes.
    timeout-minutes: 30
    # Constant, not matrix-derived — see the note on `installer.outputs`.
    outputs:
      sidecar_artifact_names: >-
        rytm-sidecar-Windows,rytm-sidecar-macOS,rytm-sidecar-Linux
      bundle_artifact_names: >-
        cockpit-bundle-windows-latest,cockpit-bundle-macos-latest,cockpit-bundle-ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Record build context
        shell: bash
        # See the note on the installer job's copy of this step: caller
        # inputs are bound through `env:`, never interpolated into the
        # script body.
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
          BUILD_SIGN: ${{ inputs.sign || false }}
          BUILD_UPDATER_ARTIFACTS: ${{ inputs.updater_artifacts || false }}
          RUNNER_OS_LABEL: ${{ runner.os }}
        run: |
          {
            echo "### desktop-bundle (${RUNNER_OS_LABEL})"
            echo ""
            echo "- ref: \`${BUILD_REF}\`"
            echo "- sign requested: \`${BUILD_SIGN}\` (adhoc-sign until U6 certificates land)"
            echo "- updater artifacts requested: \`${BUILD_UPDATER_ARTIFACTS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + shell target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/shell/target
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('desktop/shell/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-

      - name: Install Linux Tauri system deps
        # libwebkit2gtk-4.1-dev: WebKitGTK 4.1 (Tauri v2 baseline on
        #   Linux). libssl-dev: TLS for the Rust shell. libayatana-
        #   appindicator3-dev: tray icon support. librsvg2-dev: SVG
        #   loader the bundler invokes when generating .desktop icons.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      # ----- Bundled Python sidecar (PyInstaller). -----
      #
      # scripts/build_sidecar_binary.py freezes `python -m
      # rytm_randomizer.cockpit` into a one-file `rytm-sidecar` binary and
      # drops it in desktop/shell/binaries/, where tauri.conf.json's
      # `bundle.resources` glob picks it up. The shell then launches the
      # bundled binary at runtime (no Python-on-PATH requirement for end
      # users); a checkout without the binary still works via the shell's
      # dev fallback. libasound2-dev above is needed on Linux because the
      # editable install builds python-rtmidi's C extension against ALSA.
      #
      # NO signing here (matching the briefcase job): artifacts are
      # unsigned/dev-signed by design until the signing posture decision
      # lands. See docs/BUILDING_INSTALLERS.md § Signing.

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install sidecar runtime + packaging toolchain
        run: pip install -e ".[cockpit,packaging]"

      - name: Build bundled sidecar binary (PyInstaller)
        run: python scripts/build_sidecar_binary.py --output-dir desktop/shell/binaries

      # Declare the sidecar as a bundled Tauri resource HERE rather than in
      # the committed tauri.conf.json. Tauri's build script hard-fails when a
      # declared resource glob matches nothing, and the source-only
      # `cargo test` job in test.yml never builds a sidecar — a permanently
      # committed declaration therefore broke that job. Injecting it in the
      # one workflow that actually produces the binary keeps both paths
      # honest: bundles always ship the sidecar, source builds never need it.
      - name: Declare sidecar as a bundled resource
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("desktop/shell/tauri.conf.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          bundle = config["bundle"]
          resources = list(bundle.get("resources", []))
          glob = "binaries/rytm-sidecar*"
          if glob not in resources:
              resources.append(glob)
          bundle["resources"] = resources
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          print(f"tauri.conf.json bundle.resources = {resources}")
          PY
          test -n "$(ls desktop/shell/binaries/rytm-sidecar* 2>/dev/null)" \
            || { echo "::error::sidecar binary missing; the resource glob would fail the bundle"; exit 1; }

      - name: Upload standalone sidecar binary
        # Also published on its own so the release engineer can smoke-test
        # the sidecar half without unpacking the full Tauri bundle.
        uses: actions/upload-artifact@v7
        with:
          name: rytm-sidecar-${{ runner.os }}
          path: desktop/shell/binaries/rytm-sidecar*
          if-no-files-found: error
          retention-days: 30

      - name: Install web dependencies
        working-directory: desktop/web
        run: npm ci

      - name: Build web frontend (Tauri loads desktop/web/dist)
        working-directory: desktop/web
        run: npm run build

      - name: Install tauri-cli
        # Pinning to ^2 follows the workspace Cargo.toml's Tauri major.
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri bundle
        working-directory: desktop/shell
        run: cargo tauri build

      - name: Upload Tauri bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-bundle-${{ matrix.os }}
          path: desktop/shell/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 30
