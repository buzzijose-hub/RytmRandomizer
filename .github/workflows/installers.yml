name: installers

# Native end-user installer builds for RytmRandomizer.
#
# Produces a .msi (Windows), .pkg (macOS, console-app spec), AppImage + .deb
# (Linux) using BeeWare briefcase for the Python sidecar, AND a Tauri
# desktop bundle for the React cockpit shell on each of the same three
# OSes via `cargo tauri build`. The full release-engineer story is
# documented in docs/BUILDING_INSTALLERS.md.
#
# WHY NOT REQUIRED-CHECK: installer builds take ~20 minutes per OS and
# don't add useful signal on day-to-day PRs. The existing test / e2e /
# architecture jobs continue to gate PR merges (see .github/workflows/
# test.yml). This workflow only fires on:
#
#   - v* tag pushes (alongside release.yml's wheel publish)
#   - workflow_dispatch (manual release dry-run from the Actions tab)
#
# Artifacts are uploaded to the workflow run (not the GitHub Release)
# so the release engineer can download, sign locally (Windows EV cert,
# macOS Developer ID + notarization), and attach to the Release manually.
# Doing signing in CI requires storing private keys in GitHub Secrets,
# which is a posture decision the project owner has not yet made.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 30 min cap: installer builds are slow but should never hang.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Briefcase MUST build each OS's artifact on that OS:
        #   - Windows MSI: needs WiX (Windows-only tool)
        #   - macOS PKG:   needs codesign + pkgbuild (macOS-only)
        #   - Linux:       Docker-based manylinux build (cross-distro)
        include:
          - os: windows-latest
            artifact_glob: "dist/*.msi"
          - os: macos-latest
            artifact_glob: "dist/*.pkg"
          - os: ubuntu-latest
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        if: runner.os != 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      # ----- Per-OS prerequisites for briefcase. -----

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        # WiX v3 ships as a .NET tool; briefcase shells out to it to
        # generate the .msi. dotnet is preinstalled on windows-latest.
        run: dotnet tool install --global wix
        shell: pwsh

      - name: Install Xcode command line tools (macOS)
        if: runner.os == 'macOS'
        # macos-latest images preinstall Xcode CLT; this is a defensive
        # ensure step that's effectively a no-op on fresh runners.
        run: xcode-select -p || sudo xcode-select --install || true

      - name: Install ALSA + AppImage tooling (Linux)
        if: runner.os == 'Linux'
        # libasound2t64: concrete Ubuntu 24.04 provider for libasound2,
        #   the runtime ALSA shared library required by Briefcase's Linux
        #   system package dependency check.
        # libasound2-dev: python-rtmidi C-extension link target.
        # libfuse2: required to *run* an AppImage (and briefcase smoke-
        #   tests the artifact post-build).
        # python3-venv: Linux system-package builds must run Briefcase
        #   under the host system python3, not setup-python's toolcache.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libasound2-dev libfuse2 python3-venv

      # ----- Briefcase install + build. -----

      - name: Install package with installer extras
        if: runner.os != 'Linux'
        run: pip install -e ".[installer]"

      - name: Install package with installer extras (Linux system Python)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv .venv-briefcase
          . .venv-briefcase/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[installer]"
          echo "$PWD/.venv-briefcase/bin" >> "$GITHUB_PATH"

      - name: briefcase create
        run: briefcase create

      - name: briefcase build
        run: briefcase build

      - name: briefcase package (no signing in CI)
        # --no-sign / --adhoc-sign deliberately skips code-signing. CI
        # produces unsigned artifacts; the release engineer signs locally
        # with the EV cert / Developer ID. See docs/BUILDING_INSTALLERS.md
        # for the signing workflow.
        run: briefcase package --adhoc-sign
        # On Linux the Briefcase docs note adhoc-sign is a no-op (Linux
        # artifacts are not code-signed in the same sense). The flag is
        # accepted everywhere, so we keep it uniform across the matrix.

      - name: List built artifacts
        # Diagnostic step -- shows what landed in dist/ before upload.
        # Helps debug a missing-glob without re-running the whole matrix.
        shell: bash
        run: ls -la dist/ || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: rytm-randomizer-installer-${{ runner.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 30

  desktop-bundle:
    # Tauri-shell cockpit bundle, one artifact per OS. Briefcase (the
    # `installer` job above) only packages the Python sidecar; without
    # this job the desktop cockpit (Rust shell wrapping the Vite-built
    # React frontend) would never reach end-users via a release. The
    # bundle is uploaded to the workflow run for the release engineer
    # to attach to the GitHub Release alongside the briefcase installer.
    #
    # The shell must be built on each target OS — Tauri uses the host's
    # webview (WebView2 on Windows, WKWebView on macOS, WebKitGTK on
    # Linux) and the per-OS bundle format (MSI/EXE, DMG/APP, deb/AppImage)
    # is produced by `cargo tauri build` against that host's toolchain.
    name: desktop-bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 30 min cap: the first build per cache key compiles the entire
    # Tauri + wry + webview2-com tree; cached runs are ~5 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + shell target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/shell/target
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('desktop/shell/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-

      - name: Install Linux Tauri system deps
        # libwebkit2gtk-4.1-dev: WebKitGTK 4.1 (Tauri v2 baseline on
        #   Linux). libssl-dev: TLS for the Rust shell. libayatana-
        #   appindicator3-dev: tray icon support. librsvg2-dev: SVG
        #   loader the bundler invokes when generating .desktop icons.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install web dependencies
        working-directory: desktop/web
        run: npm ci

      - name: Build web frontend (Tauri loads desktop/web/dist)
        working-directory: desktop/web
        run: npm run build

      - name: Install tauri-cli
        # Pinning to ^2 follows the workspace Cargo.toml's Tauri major.
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri bundle
        working-directory: desktop/shell
        run: cargo tauri build

      - name: Upload Tauri bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-bundle-${{ matrix.os }}
          path: desktop/shell/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 30
