name: promote

# Promote an already-released version onto the stable channel, at a
# chosen rollout percentage.
#
# This is the human-approved half of the gating model (spec §4.1). The
# release train publishes to `beta.json` automatically; moving a version
# to `stable.json` — and widening its rollout — is always a deliberate
# operator act. The `stable-promote` environment supplies that gate: it
# is configured with required reviewers, so this workflow pauses for an
# approval button before any job step runs. That is the same trust shape
# as CODEOWNERS, expressed in the Actions layer.
#
# Promotion and rollback are the SAME operation: re-running this workflow
# with an older version re-points stable.json at that release. Clients
# that already updated stay where they are; clients that have not yet
# updated never see the withdrawn version. Time-to-stop-the-bleeding is
# one workflow run.
#
# Operator action item #2 (repo Settings → Environments) must create the
# `stable-promote` environment with required-reviewer protection before
# this workflow provides any gate at all — an environment that does not
# exist yet does not block.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to promote to stable, without a leading `v`
          (e.g. 1.35.1). It must already exist as a published release.
        type: string
        required: true
      rollout_percent:
        description: >-
          Percentage of the fleet eligible for this version (0-100).
          Bucketing is deterministic per install, so each step is a strict
          superset of the last — nobody flaps in or out. Typical ladder:
          10 -> 50 -> 100, driven by the dashboard's observed health.
        type: string
        required: true
        default: "10"

# Shared with release.yml so a promote can never race a release: both
# write manifests on the `releases` branch, and interleaving them would
# let the later push silently clobber the earlier one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    name: promote to stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The approval gate. See the header note on operator action item #2.
    environment: stable-promote
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Generate stable manifest
        shell: bash
        # `version` and `rollout_percent` are free-text dispatch inputs.
        # Interpolating them with `${{ }}` would splice operator-supplied
        # text into the script BODY before bash parses it, so a crafted
        # value would execute. Through `env:` they are only ever data, and
        # `release_lib` refuses a malformed version on its own terms.
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
          PROMOTE_ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
        run: |
          set -euo pipefail
          mkdir -p generated
          python scripts/release_lib.py generate \
            --channel stable \
            --version "$PROMOTE_VERSION" \
            --rollout-percent "$PROMOTE_ROLLOUT_PERCENT" \
            --output generated/stable.json

      # Validate BEFORE committing. The releases-branch push would run
      # manifest-validate.yml afterwards, but that is too late: a bad
      # stable.json is live to the fleet the moment it lands. Same
      # validator, same rules, one implementation (reuse contract R1/R5).
      - name: Validate generated manifest
        run: python scripts/validate_manifest.py generated/stable.json --summary

      - name: Commit stable manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_VERSION: ${{ inputs.version }}
          PROMOTE_ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin releases
          git checkout releases
          cp generated/stable.json stable.json
          git add stable.json
          if git diff --cached --quiet; then
            echo "stable.json unchanged; nothing to commit."
          else
            git commit -m "chore(promote): stable.json -> ${PROMOTE_VERSION} at ${PROMOTE_ROLLOUT_PERCENT}%"
            git push origin releases
          fi

      - name: Summarize promotion
        if: always()
        shell: bash
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
          PROMOTE_ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## promote"
            echo ""
            echo "- version: \`${PROMOTE_VERSION}\`"
            echo "- rollout percent: \`${PROMOTE_ROLLOUT_PERCENT}\`"
            echo "- approved via environment: \`stable-promote\`"
            echo "- status: \`${JOB_STATUS}\`"
          } >> "$GITHUB_STEP_SUMMARY"
