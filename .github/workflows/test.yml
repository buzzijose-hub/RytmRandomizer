name: test

on:
  push:
  pull_request:

# NOTE: A coverage job (WS-I) and an e2e job (WS-R) will be added as
# sibling jobs in this file and registered as required status checks
# once those workstreams land. See docs/BRANCH_PROTECTION.md.

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest

      - name: Import smoke test
        run: python -c "import rytm_hybrid_randomizer_v134; import rytm_randomizer"
