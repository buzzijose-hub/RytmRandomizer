name: test

on:
  push:
  pull_request:

# NOTE: This workflow runs three required-check jobs:
#
#   architecture (WS-T) — fast ubuntu runner that runs the gated
#       architecture-conformance tests (tests/architecture/). The full
#       `test` matrix job also runs these (pytest runs the whole suite),
#       but this dedicated job gives branch protection a cheap, fast-
#       failing required check named "architecture".
#
#   test (WS-E) — 3-OS matrix (windows-latest, macos-latest, ubuntu-latest)
#       running the full pytest suite + an import smoke test. Required.
#
#   e2e (WS-R) — 3-OS matrix running the end-to-end suite (tests/e2e/),
#       which drives the real entry point through the V1.34 canonical
#       operator-command flow in --dry-run mode against MockMidiSender,
#       with random.seed() set for full determinism. Required on all 3 OSs.
#
# A coverage job (WS-I) will be added as another sibling once WS-I lands.
# All required-check context names are referenced from
# scripts/apply-branch-protection.sh — see docs/BRANCH_PROTECTION.md.

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Architecture tests grep `git diff` for the monolith; we need a
          # working tree to diff against.
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run architecture-conformance tests
        run: pytest tests/architecture/ -q

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest

      - name: Import smoke test
        run: python -c "import rytm_hybrid_randomizer_v134; import rytm_randomizer"

  e2e:
    # WS-R end-to-end gate: drives the real entry point (rytm-randomizer)
    # through the V1.34 canonical operator-command flow in --dry-run mode
    # against MockMidiSender, with random.seed() set for full determinism.
    # The canonical-flow test asserts byte-for-byte parity against the
    # committed golden file tests/e2e/_golden/canonical_validation_flow.json.
    #
    # IMPORTANT: this job MUST be in the branch-protection required-checks
    # list. See scripts/apply-branch-protection.sh -- the context names
    # below ("e2e (windows-latest, py3.11)" etc.) are what branch protection
    # references.
    name: e2e (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run E2E suite
        # --dry-run against MockMidiSender, no hardware, no port opened.
        run: pytest tests/e2e/ -v
