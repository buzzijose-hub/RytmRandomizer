name: test

on:
  push:
  pull_request:
  schedule:
    # Weekly scan: re-runs the security (pip-audit) and architecture
    # gates against currently-merged code so a freshly-disclosed CVE in
    # mido / python-rtmidi can be caught even when no PRs are open.
    # Sunday 06:00 UTC keeps it out of weekday peak hours.
    - cron: "0 6 * * 0"
  workflow_dispatch:

# NOTE: This workflow runs five required-check jobs gated by path filters
# so a docs-only change doesn't burn 30 minutes of CI on the full matrix.
#
# Job summary:
#
#   detect-changes — fast preamble that classifies what changed and emits
#       boolean flags (`code`, `tests`, `deps`, `docs-only`, `ci`). Every
#       downstream job has an `if:` condition gated on these flags.
#       Skipped required-check jobs are reported as success to branch
#       protection (the workflow itself always runs).
#
#   lint — runs on any .py change, pyproject.toml change, or pre-commit
#       config change. Enforces ruff/black/isort.
#
#   security — runs on any dependency-surface change (pyproject.toml,
#       requirements-*.txt) OR on the weekly schedule (see below). Runs
#       pip-audit against the installed env.
#
#   architecture (WS-T) — fast ubuntu runner that runs the gated
#       architecture-conformance tests (tests/architecture/). Triggers
#       on any rytm_randomizer/ or rytm_hybrid_randomizer_v134.py change.
#       Gives branch protection a cheap, fast-failing required check.
#
#   test (WS-E) — 3-OS matrix running the full pytest suite + branch-
#       coverage gate (configured in pyproject.toml under
#       [tool.coverage.report] fail_under). Triggers on any rytm_randomizer/,
#       tests/, pyproject.toml, or monolith change.
#
#   e2e (WS-R) — 3-OS matrix running the end-to-end suite (tests/e2e/),
#       which drives the real entry point through the V1.34 canonical
#       operator-command flow in --dry-run mode against MockMidiSender,
#       with random.seed() set for full determinism. Triggers on the same
#       paths as `test` plus tests/e2e/.
#
# Weekly schedule also runs the security + architecture jobs so freshly-
# disclosed CVEs in mido / python-rtmidi cannot sit hidden in already-
# merged code.
#
# All jobs cache pip downloads via actions/setup-python's `cache: pip` option,
# keyed off pyproject.toml's hash, to keep CI minutes low.
# All required-check context names are referenced from
# scripts/apply-branch-protection.sh — see docs/BRANCH_PROTECTION.md.

jobs:
  detect-changes:
    # Classify which categories of files changed in this push/PR so the
    # heavier downstream jobs can opt out of running for docs-only edits.
    # On a `push` event without a base SHA (e.g. branch creation),
    # paths-filter falls back to "everything changed" via the `base: false`
    # default behavior, which is the safe default.
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      tests: ${{ steps.filter.outputs.tests }}
      deps: ${{ steps.filter.outputs.deps }}
      ci: ${{ steps.filter.outputs.ci }}
      e2e: ${{ steps.filter.outputs.e2e }}
      architecture: ${{ steps.filter.outputs.architecture }}
      lint-targets: ${{ steps.filter.outputs.lint-targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Default predicate-quantifier is "some": a category is true if
          # ANY listed pattern matches a changed file. That is what we want.
          filters: |
            # `code` -- any change that affects runtime / production code.
            # The byte-frozen monolith counts too: changing it would trigger
            # the architecture-conformance test and the parity tests.
            code:
              - 'rytm_randomizer/**'
              - 'rytm_hybrid_randomizer_v134.py'
              - 'Scripts/**'

            # `tests` -- any test source change. Note tests/architecture/ is
            # called out separately so a pure architecture-test edit triggers
            # the cheap arch job without spinning up the 3-OS matrix.
            tests:
              - 'tests/**'

            # `architecture` -- any architecture-conformance test change OR
            # any production code change. The arch tests must validate the
            # current state of the package on every code-touching PR.
            architecture:
              - 'rytm_randomizer/**'
              - 'rytm_hybrid_randomizer_v134.py'
              - 'tests/architecture/**'

            # `e2e` -- triggers the (slow) 3-OS e2e matrix. Production code,
            # the monolith, or anything under tests/e2e/.
            e2e:
              - 'rytm_randomizer/**'
              - 'rytm_hybrid_randomizer_v134.py'
              - 'tests/e2e/**'
              - 'pyproject.toml'

            # `deps` -- dependency surface. Triggers the security (pip-audit)
            # job. Bumping a dep can introduce a CVE.
            deps:
              - 'pyproject.toml'
              - 'requirements-dev.txt'
              - '.github/workflows/**'

            # `ci` -- workflow / CI infrastructure change. Always re-runs
            # the lint+security gates to make sure the new workflow itself
            # validates.
            ci:
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'
              - 'scripts/apply-branch-protection.sh'

            # `lint-targets` -- anything that black/ruff/isort would
            # inspect, or the config that drives them.
            lint-targets:
              - '**/*.py'
              - 'pyproject.toml'
              - '.pre-commit-config.yaml'

  lint:
    name: lint
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.detect-changes.outputs.lint-targets == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      # Pin lint tool versions in lockstep with .pre-commit-config.yaml so
      # local pre-commit runs and CI produce identical verdicts. When you
      # bump a hook in .pre-commit-config.yaml, bump it here too.
      - name: Install lint tools
        run: pip install "ruff==0.15.13" "black==26.3.1" "isort==8.0.1"

      - name: ruff check
        run: ruff check .

      - name: black --check
        run: black --check .

      - name: isort --check
        run: isort --check-only --profile black .

  security:
    # Static security scan of declared dependencies. pip-audit cross-references
    # every locked dependency against the PyPI Advisory Database (powered by
    # OSV) and fails on any known CVE in something the project pulls in.
    # Runs on any dependency or workflow change; the scheduled nightly run
    # (configured separately in this workflow) re-scans already-merged code
    # against newly-published advisories.
    name: security
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.detect-changes.outputs.deps == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # Upgrade pip itself so pip-audit doesn't flag the CI runner's
      # bundled pip for CVEs (those are CI-runner infrastructure, not a
      # project dependency, but pip-audit cannot tell the difference).
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Install pip-audit
        run: pip install "pip-audit>=2.10,<3"

      # --strict turns transient resolver errors into failures so a flaky
      # advisory feed cannot silently mark the run green. pip-audit
      # scans the currently-installed environment (no `-r` argument), so
      # the previous `pip install -e .[dev]` is what gets scanned.
      # --skip-editable excludes the editable-install of rytm-randomizer
      # itself; this project is not published to PyPI so pip-audit cannot
      # look it up and would otherwise fail with "Dependency not found".
      - name: Run pip-audit
        run: pip-audit --strict --skip-editable

  architecture:
    name: architecture
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.detect-changes.outputs.architecture == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Architecture tests grep `git diff` for the monolith; we need a
          # working tree to diff against.
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run architecture-conformance tests
        run: pytest tests/architecture/ -q

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.detect-changes.outputs.code == 'true' ||
      needs.detect-changes.outputs.tests == 'true' ||
      needs.detect-changes.outputs.deps == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      # Run the full suite with branch coverage. The gate floor is
      # configured in pyproject.toml under [tool.coverage.report]
      # fail_under and is currently set to the measured baseline (86%)
      # while a dedicated workstream ratchets toward 100%. Bump the
      # pyproject.toml value when coverage measurably improves; never
      # lower it. Any new production code without a covering test will
      # fail this step.
      - name: Run pytest with coverage
        run: pytest --cov=rytm_randomizer --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage XML (for downstream inspection)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Import smoke test
        run: python -c "import rytm_hybrid_randomizer_v134; import rytm_randomizer"

  e2e:
    # WS-R end-to-end gate: drives the real entry point (rytm-randomizer)
    # through the V1.34 canonical operator-command flow in --dry-run mode
    # against MockMidiSender, with random.seed() set for full determinism.
    # The canonical-flow test asserts byte-for-byte parity against the
    # committed golden file tests/e2e/_golden/canonical_validation_flow.json.
    #
    # Branch-protection references only the `required-checks` aggregate
    # job (see scripts/apply-branch-protection.sh). This e2e job is one
    # of the upstream gates that aggregate depends on; renaming or
    # removing a matrix entry is now safe without touching branch
    # protection config.
    name: e2e (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.detect-changes.outputs.e2e == 'true' ||
      needs.detect-changes.outputs.ci == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run E2E suite
        # --dry-run against MockMidiSender, no hardware, no port opened.
        run: pytest tests/e2e/ -v

  required-checks:
    # Aggregate gate for branch protection. Path filters cause individual
    # upstream jobs to skip on irrelevant changes (e.g. a docs-only edit
    # skips the test matrix). GitHub branch protection treats "skipped"
    # required checks as pending and blocks the PR forever -- so we
    # require only THIS job and let it enforce the real semantics:
    # "every upstream job either succeeded or was correctly skipped."
    #
    # The job always runs (`if: always()`) so the required-check status
    # is always reported. It fails only if any upstream job's result is
    # `failure` or `cancelled`. `skipped` counts as success because the
    # path filter said this category did not need to be re-validated.
    name: required-checks
    needs: [detect-changes, lint, security, architecture, test, e2e]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Summarize upstream job results
        # Echo each upstream result for the run log so a failure is
        # easy to triage from the GitHub UI without expanding every job.
        run: |
          echo "detect-changes : ${{ needs.detect-changes.result }}"
          echo "lint           : ${{ needs.lint.result }}"
          echo "security       : ${{ needs.security.result }}"
          echo "architecture   : ${{ needs.architecture.result }}"
          echo "test           : ${{ needs.test.result }}"
          echo "e2e            : ${{ needs.e2e.result }}"

      - name: Fail if any upstream job failed or was cancelled
        # GitHub workflow `needs.*.result` is one of: success, failure,
        # cancelled, skipped. Treat `skipped` as success (the path
        # filter said the job did not need to run); any other non-
        # `success` value is a real problem and fails the gate.
        run: |
          for result in \
            "${{ needs.detect-changes.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.architecture.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.e2e.result }}"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Upstream job result '$result' is not success/skipped — failing the gate."
                exit 1
                ;;
            esac
          done
          echo "All upstream jobs either succeeded or were correctly skipped."
